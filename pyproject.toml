[project]
requires-python = ">=3.9"
name = "testapp"
version = "0.1.0"
description = "short test app"
authors = [
    { name = "testappmyproject", email = "draminilab57@gmail.com" },
]

dependencies = [
    "fastapi>=0.103.0",
    "uvicorn==0.23.2",
    "pydantic>=2.0.0",
    "requests>=2.32.0",
    "loguru>=0.7.0",
    "joblib>=1.2.0",
    "scikit-learn>=1.5.0",
    "pyodbc>=5.1.0",
    "jdatetime",
    "jinja2>=3.0.0",
    "pdfkit>=1.0.0",
    "persiantools>=2.0.0",
    "itsdangerous>=2.0.0",
    "python-multipart>=0.0.5",
    "apscheduler>=3.10.4,<4",
    "websockets>=12.0"
]

[dependency-groups]
dev = [
    "pytest>=7.2",
    "black>=24.3",
    "autopep8>=2.0.0",
    "ipdb>=0.13.0",
    "pylint>=3.0.0"
]

[project.optional-dependencies]
aws = [
    "mangum>=0.17.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
  \.toml
  |\.sh
  |\.git
  |\.ini
  |Dockerfile
  |Jenkinfile
)/
'''

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
