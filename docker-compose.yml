version: "3"

services:
  app:
    build:
      context: .
      args:
        DEV: "true"
    ports:
      - "8080:8080"
    env_file:
      - .env
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8080
    volumes:
      - ./app:/app/
      - ./ml/model/:/app/ml/model/
# ── Production notes ─────────────────────────────────────────────────────────
# The settings above are for local development (bind mount + --reload + port
# 8080 published on all interfaces).  The supported LAN deployment runs the
# application on loopback behind Caddy:
#
#   uvicorn main:app --host 127.0.0.1 --port 8000 --proxy-headers \
#           --forwarded-allow-ips 127.0.0.1
#
# When Hastama runs in a container behind a proxy on the host, set
# TRUSTED_PROXY_IPS to the address the container sees the proxy as (for example
# 172.17.0.1 for the default Docker bridge) — otherwise forwarding headers are
# ignored on purpose and rate limiting keys on the proxy address.
