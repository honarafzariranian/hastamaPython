<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/css/label-print.css">
<style>
  body { margin: 0; background: #e2e8f0; }
  /* mirrors the print window: page box + rotated label */
  .lbl-page { position: relative; width: 55mm; height: 50mm; overflow: hidden; background: #fff; outline: 1px solid red; }
  .lbl--print.is-rotated {
    position: absolute;
    top: 0;
    left: 0;
    right: auto;
    margin: 0 !important;
    transform: translateY(calc(var(--lbl-mm-w, 55) * 1mm)) rotate(-90deg);
    transform-origin: top left;
  }
  #report { position: fixed; top: 4px; left: 4px; font: 12px monospace; background: #fff; padding: 6px; direction: ltr; }
</style>
</head>
<body>
<div class="lbl-page" id="page">
  <div class="lbl lbl--print is-rotated" id="lbl" style="--lbl-mm-w: 50; --lbl-mm-h: 55" data-template="queue">
    <div class="lbl__content">
      <header class="lbl__header"><div class="lbl__identity"><div class="lbl__identity-text"><h3 class="lbl__lab-name">آزمایشگاه</h3></div></div></header>
      <section class="lbl__queue"><div class="lbl__number-box"><span class="lbl__queue-number">۱۲</span></div></section>
      <footer class="lbl__footer"><div class="lbl__brand-text"><strong>هستما</strong></div></footer>
    </div>
  </div>
</div>
<div id="report"></div>
<script>
window.addEventListener('load', function () {
  var page = document.getElementById('page').getBoundingClientRect();
  var lbl = document.getElementById('lbl');
  var r = lbl.getBoundingClientRect();
  document.getElementById('report').textContent = JSON.stringify({
    pagePx: [Math.round(page.width), Math.round(page.height)],
    footprintPx: [Math.round(r.width), Math.round(r.height)],
    offsetInPage: [Math.round(r.left - page.left), Math.round(r.top - page.top)],
    intrinsicPx: [lbl.clientWidth, lbl.clientHeight],
    fits: r.left >= page.left - 0.5 && r.right <= page.right + 0.5 && r.top >= page.top - 0.5 && r.bottom <= page.bottom + 0.5,
  });
});
</script>
</body>
</html>
