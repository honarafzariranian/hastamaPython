<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه هستما</title>
    <link rel="icon" href="{{ url_for('static', path='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', path='css/vazir.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/dark-theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/login-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/hastama-ux.css') }}">
    <script src="{{ url_for('static', path='js/theme.js') }}"></script>
</head>

<body>
    <div class="top-actions">
        <div class="tooltip-wrap">
            <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="تغییر تم">
                <span class="theme-toggle-moon">🌙</span>
                <span class="theme-toggle-sun">☀️</span>
            </button>
            <span class="tooltip">تغییر تم</span>
        </div>
        <div class="tooltip-wrap">
            <a href="#" class="support-toggle" aria-label="پشتیبانی">
                <span>🎧</span>
            </a>
            <span class="tooltip">پشتیبانی</span>
        </div>
    </div>

    <div class="login-page">
        <div class="login-card">
            <div class="brand-row">
                <div class="brand">
                    <img class="login-logo" src="{{ url_for('static', path='images/login-mobile-logo.png') }}" alt="لوگوی هستما">
                </div>
            </div>

            <div class="login-header">
                <h2>خوش آمدید</h2>
                <p>برای دسترسی به داشبورد اطلاعات خود را وارد کنید.</p>
            </div>

            <form class="login-form" onsubmit="event.preventDefault(); login();">
                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="text" id="username" name="username" required autocomplete="username">
                        <label for="username">نام کاربری</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <label for="password">رمز عبور</label>
                        <span class="focus-border"></span>
                    </div>
                </div>

                <div class="form-footer">
                    <label class="remember-wrapper">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkbox-label">
                            <span class="checkmark"></span>
                            مرا به خاطر بسپار
                        </span>
                    </label>
                    <a href="#" class="forgot-password">فراموشی رمز عبور؟</a>
                </div>

                                <button type="submit" class="btn" id="loginBtn">
                    <span class="h-ux-btn-text">ورود</span>
                    <span class="h-ux-btn-spinner"></span>
                    <span class="h-ux-btn-loading-text">در حال ورود...</span>
                </button>
            </form>
        </div>
    </div>

    <footer class="login-footer">
        محصولی از شرکت هنر افزار ایرانیان - نسخه آزمایشی
    </footer>

    <div class="waves" aria-hidden="true">
        <svg class="wave wave1" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(68,180,255,0.08)"
                d="M0,192L60,176C120,160,240,128,360,128C480,128,600,160,720,176C840,192,960,192,1080,165C1200,139,1320,85,1380,58L1440,32L1440,320L0,320Z"/>
        </svg>

        <svg class="wave wave2" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(47,124,246,0.06)"
                d="M0,96L80,122C160,149,320,203,480,208C640,213,800,171,960,144C1120,117,1280,107,1360,101L1440,96L1440,320L0,320Z"/>
        </svg>

        <svg class="wave wave3" viewBox="0 0 1440 320" preserveAspectRatio="none">
            <path fill="rgba(72,193,181,0.05)"
                d="M0,256L90,229C180,203,360,149,540,128C720,107,900,117,1080,149C1260,181,1350,235,1440,256L1440,320L0,320Z"/>
        </svg>
    </div>

    <script src="{{ url_for('static', path='js/notification-system.js') }}"></script>
    <script src="{{ url_for('static', path='js/hastama-ux.js') }}"></script>
    <script src="{{ url_for('static', path='js/script.js') }}"></script>
</body>

</html>
