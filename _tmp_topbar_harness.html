<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>topbar harness</title>
    <link rel="stylesheet" href="http://127.0.0.1:5000/static/css/user-panel-style.css">
    <link rel="stylesheet" href="http://127.0.0.1:5000/static/css/responsive-mobile.css">
    <link rel="stylesheet" href="http://127.0.0.1:5000/static/css/dark-theme.css">
    <link rel="stylesheet" href="http://127.0.0.1:5000/static/css/hastama-ux.css">
    <style>
        /* harness-only: show the boxes so the layout is readable in a screenshot */
        .topbar { outline: 1px dashed #d00; }
        .topbar-actions { outline: 1px dashed #06c; }
        .mobile-menu-toggle { outline: 1px dashed #0a0; }
        .topbar > * { outline-offset: 2px; }
        body { margin: 0; }
    </style>
</head>
<body class="user-panel-page">
    <div class="app-shell">
        <header class="topbar">
            <button type="button" class="mobile-menu-toggle" aria-label="باز کردن منو" aria-controls="mainSidebar" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="topbar-actions">
                <div class="topbar-clock-pill" id="topbarClockBadge" aria-live="polite">
                    <span class="topbar-clock-date" id="topbarDateText">۱۴۰۵/۰۷/۰۵</span>
                    <span class="topbar-clock-time" id="topbarTimeText">۱۱:۰۷:۱۶</span>
                </div>
                <button type="button" class="topbar-icon-btn notification-bell" id="notificationBell" aria-label="اعلان‌ها" aria-haspopup="dialog" aria-expanded="false">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path><path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                    <span class="topbar-badge NumberNotif" id="notificationUnreadBadge" hidden>۰</span>
                </button>
                <div class="topbar-icon-btn theme-toggle" id="themeToggleBtn" role="button" tabindex="0" aria-label="تاریک کردن تم" aria-pressed="false">
                    <svg class="theme-toggle-moon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    <svg class="theme-toggle-sun" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                </div>
                <div class="topbar-user" id="profileCard">
                    <div class="topbar-avatar-wrap">
                        <img class="topbar-avatar" id="topbarAvatar" src="http://127.0.0.1:5000/static/images/user.png" alt="پروفایل کاربر">
                    </div>
                    <div class="topbar-user-info">
                        <span class="topbar-user-name">آی تی</span>
                        <span class="topbar-user-role">کارشناس فناوری اطلاعات</span>
                    </div>
                    <svg class="chevron-icon" viewBox="0 0 24 24" fill="none"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
            </div>
        </header>
    </div>
</body>
</html>
